<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- SECURITÉ ANTI-RÉFÉRENCEMENT ABSOLUE -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Facture & Fiche Atelier — Rubens Saffiano</title>
<meta name="description" content="Votre espace sécurisé de validation de commande.">
<meta name="theme-color" content="#F7F5F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Script de génération PDF local -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root { --f: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-weight: normal; }
  
  html, body {
    background-color: #F7F5F0;
    color: #111;
    font-family: var(--f);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  /* --- En-tête épuré & Vagues de luxe animées --- */
  header.entete {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: sticky;
    top: 0;
    background-color: #F7F5F0;
    z-index: 1000;
    padding: 0 20px;
    overflow: hidden;
  }
  
  .vague-gauche, .vague-droite {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4cec4);
    opacity: 0;
    animation: fadeIn 1.5s ease 0.5s forwards;
  }
  .vague-gauche { margin-right: 15px; }
  .vague-droite { background: linear-gradient(90deg, #d4cec4, transparent); margin-left: 15px; }

  header.entete .marque {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #111;
    opacity: 0;
    animation: fadeIn 1.5s ease 0.3s forwards;
    white-space: nowrap;
  }

  header.entete::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background-color: #e3ded5;
    animation: expandLine 1.5s cubic-bezier(0.8, 0, 0.2, 1) forwards;
  }

  /* --- Animations --- */
  @keyframes expandLine { to { width: 100%; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .anim {
    opacity: 0;
    animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .d-1 { animation-delay: 0.1s; }
  .d-2 { animation-delay: 0.2s; }
  .d-3 { animation-delay: 0.3s; }
  .d-4 { animation-delay: 0.4s; }

  /* --- Conteneur légèrement allongé pour descendre un tout petit peu plus bas --- */
  .conteneur { max-width: 600px; margin: 0 auto; padding: 26px 20px 50px; }
  
  .titre-section {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin: 26px 0 11px 0;
    border-bottom: 1px solid #e3ded5;
    padding-bottom: 6px;
    color: #222;
  }
  .titre-section:first-child { margin-top: 0; }
  
  .champ { margin-bottom: 14px; position: relative; }
  .champ input, .champ textarea {
    width: 100%;
    font-family: var(--f);
    font-size: 14px;
    font-weight: 300;
    color: #111;
    border: 0;
    border-bottom: 1px solid #d4cec4;
    background: transparent;
    padding: 12px 0;
    outline: none;
    border-radius: 0;
    appearance: none;
    transition: border-color 0.3s ease;
  }
  .champ input:focus, .champ textarea:focus {
    border-bottom: 1px solid #111;
  }
  .champ input::placeholder, .champ textarea::placeholder { color: #888; }
  .champ textarea { resize: vertical; min-height: 72px; }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  
  /* --- Bouton d'action --- */
  .bouton {
    display: block;
    width: 100%;
    margin-top: 32px;
    background: #F7F5F0;
    color: #111;
    border: 1px solid #111;
    padding: 16px;
    font-family: var(--f);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .25em;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    transition: background-color 0.4s ease, color 0.4s ease;
  }
  .bouton:hover { background: #111; color: #F7F5F0; }

  /* Style du document PDF généré */
  .pdf-rendu {
    background-color: #F7F5F0;
    padding: 40px;
    font-family: var(--f);
    color: #111;
  }
  .pdf-entete {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 30px;
    border-bottom: 1px solid #e3ded5;
    padding-bottom: 15px;
  }
</style>
</head>
<body>

  <!-- En-tête raffiné avec vagues de luxe -->
  <header class="entete">
    <div class="vague-gauche"></div>
    <span class="marque">RUBENS SAFFIANO</span>
    <div class="vague-droite"></div>
  </header>

  <main class="conteneur" id="zone-formulaire">
    
    <!-- Section 1 -->
    <div class="anim d-1">
      <div class="titre-section">01. Informations Personnelles</div>
      <div class="champ">
        <input type="text" id="nom" placeholder="Nom et Prénom" autocomplete="name">
      </div>
      <div class="champ">
        <input type="tel" id="tel" placeholder="Numéro de téléphone" autocomplete="tel">
      </div>
      <div class="champ">
        <input type="text" id="adresse" placeholder="Adresse complète de livraison" autocomplete="street-address">
      </div>
    </div>

    <!-- Section 2 -->
    <div class="anim d-2">
      <div class="titre-section">02. Caractéristiques Morphologiques</div>
      <div class="grille">
        <div class="champ">
          <input type="number" id="taille" placeholder="Taille (cm)">
        </div>
        <div class="champ">
          <input type="number" id="poids" placeholder="Poids (kg)">
        </div>
        <div class="champ">
          <input type="number" id="poitrine" placeholder="Tour de poitrine (cm)">
        </div>
        <div class="champ">
          <input type="number" id="epaule" placeholder="Tour d'épaule (cm)">
        </div>
      </div>
    </div>

    <!-- Section 3 -->
    <div class="anim d-3">
      <div class="titre-section">03. Sélection de Qualité</div>
      <div class="champ">
        <textarea id="qualite" placeholder="Précisez votre sélection..."></textarea>
      </div>
    </div>

    <!-- Bouton -->
    <div class="anim d-4">
      <button type="button" class="bouton" id="envoyer">Transmettre à l'atelier</button>
    </div>

  </main>

  <script>
    document.getElementById("envoyer").addEventListener("click", function(){
      var btn = this;
      btn.innerText = "Génération du PDF...";

      var nom = document.getElementById("nom").value.trim() || "Client";
      var tel = document.getElementById("tel").value.trim() || "—";
      var adresse = document.getElementById("adresse").value.trim() || "—";
      var taille = document.getElementById("taille").value.trim() || "—";
      var poids = document.getElementById("poids").value.trim() || "—";
      var poitrine = document.getElementById("poitrine").value.trim() || "—";
      var epaule = document.getElementById("epaule").value.trim() || "—";
      var qualite = document.getElementById("qualite").value.trim() || "—";

      var element = document.createElement('div');
      element.className = 'pdf-rendu';
      element.innerHTML = `
        <div class="pdf-entete">RUBENS SAFFIANO — FICHE ATELIER</div>
        <div class="titre-section">01. INFORMATIONS PERSONNELLES</div>
        <p style="margin-bottom:8px;"><strong>Nom et Prénom :</strong> ${nom}</p>
        <p style="margin-bottom:8px;"><strong>Téléphone :</strong> ${tel}</p>
        <p style="margin-bottom:20px;"><strong>Adresse :</strong> ${adresse}</p>
        
        <div class="titre-section">02. CARACTÉRISTIQUES MORPHOLOGIQUES</div>
        <p style="margin-bottom:8px;"><strong>Taille :</strong> ${taille !== "—" ? taille + " cm" : "—"}</p>
        <p style="margin-bottom:8px;"><strong>Poids :</strong> ${poids !== "—" ? poids + " kg" : "—"}</p>
        <p style="margin-bottom:8px;"><strong>Tour de poitrine :</strong> ${poitrine !== "—" ? poitrine + " cm" : "—"}</p>
        <p style="margin-bottom:20px;"><strong>Tour d'épaule :</strong> ${epaule !== "—" ? epaule + " cm" : "—"}</p>
        
        <div class="titre-section">03. SÉLECTION DE QUALITÉ</div>
        <p style="white-space: pre-wrap;">${qualite}</p>
      `;

      var opt = {
        margin:       10,
        filename:     'Fiche_Mesures_Rubens_Saffiano.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(function(){
        btn.innerText = "Transmettre à l'atelier";
        var msg = "Bonjour Rubens Saffiano,\nJe viens de télécharger ma fiche de mesures en PDF. Je vous la joins à ce message 📎.";
        var numWA = "33695772805";
        window.open("https://wa.me/" + numWA + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
      });
    });
  </script>

</body>
</html>
