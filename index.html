<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- SECURITÉ ANTI-RÉFÉRENCEMENT ABSOLUE -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Rubens Saffiano</title>
<meta name="theme-color" content="#F9F8F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Script de génération PDF local -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root { --f: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-weight: normal; }
  
  html, body {
    background-color: #F9F8F6;
    color: #000;
    font-family: var(--f);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  /* --- En-tête épuré & Animation Luxe --- */
  header.entete {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center; /* Centrage absolu sans icônes */
    background-color: #F9F8F6;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  
  /* Ligne animée sous l'en-tête (remplace les bordures statiques) */
  header.entete::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background-color: #eae6e0;
    animation: expandLine 1.5s cubic-bezier(0.8, 0, 0.2, 1) forwards;
  }

  header.entete .marque {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #000;
    opacity: 0;
    animation: fadeIn 1.5s ease 0.3s forwards;
  }

  /* --- Animations d'apparition (Fade-up) --- */
  @keyframes expandLine {
    to { width: 100%; }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .anim {
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .d-1 { animation-delay: 0.2s; }
  .d-2 { animation-delay: 0.3s; }
  .d-3 { animation-delay: 0.4s; }
  .d-4 { animation-delay: 0.5s; }

  /* --- Formulaire & zones à imprimer --- */
  .conteneur { max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
  
  .titre-section {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    margin: 40px 0 20px 0;
    border-bottom: 1px solid #eae6e0;
    padding-bottom: 10px;
  }
  .titre-section:first-child { margin-top: 0; }
  
  .champ { margin-bottom: 16px; position: relative; }
  .champ input, .champ textarea {
    width: 100%;
    font-family: var(--f);
    font-size: 13px;
    font-weight: 300;
    color: #000;
    border: 0;
    border-bottom: 1px solid #000;
    background: transparent;
    padding: 12px 0;
    outline: none;
    border-radius: 0;
    appearance: none;
    transition: border-color 0.4s ease, opacity 0.4s ease;
  }
  .champ input:focus, .champ textarea:focus {
    border-bottom: 1px solid #a8a39d;
  }
  .champ input::placeholder, .champ textarea::placeholder { color: #888; transition: opacity 0.3s; }
  .champ input:focus::placeholder, .champ textarea:focus::placeholder { opacity: 0.3; }
  .champ textarea { resize: vertical; min-height: 80px; }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  
  /* --- Bouton d'action --- */
  .bouton {
    display: block;
    width: 100%;
    margin-top: 40px;
    background: #F9F8F6; /* Ivoire au repos */
    color: #000;
    border: 1px solid #000;
    padding: 16px;
    font-family: var(--f);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .25em;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s ease;
  }
  .bouton:hover { background: #000; color: #F9F8F6; }

  /* Style du document PDF généré */
  .pdf-rendu {
    background-color: #F9F8F6;
    padding: 40px;
    font-family: var(--f);
    color: #000;
  }
  .pdf-entete {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 30px;
    border-bottom: 1px solid #eae6e0;
    padding-bottom: 15px;
  }
</style>
</head>
<body>

  <header class="entete">
    <span class="marque">RUBENS SAFFIANO</span>
  </header>

  <main class="conteneur" id="zone-formulaire">
    
    <!-- Section 1 -->
    <div class="anim d-1">
      <div class="titre-section">01. Informations Personnelles</div>
      <div class="champ">
        <input type="text" id="nom" placeholder="Nom et Prénom" autocomplete="name">
      </div>
      <div class="champ">
        <input type="tel" id="tel" placeholder="Numéro de téléphone" autocomplete="tel">
      </div>
      <div class="champ">
        <input type="text" id="adresse" placeholder="Adresse complète de livraison" autocomplete="street-address">
      </div>
    </div>

    <!-- Section 2 -->
    <div class="anim d-2">
      <div class="titre-section">02. Caractéristiques Morphologiques</div>
      <div class="grille">
        <div class="champ">
          <input type="number" id="taille" placeholder="Taille (cm)">
        </div>
        <div class="champ">
          <input type="number" id="poids" placeholder="Poids (kg)">
        </div>
        <div class="champ">
          <input type="number" id="poitrine" placeholder="Tour de poitrine (cm)">
        </div>
        <div class="champ">
          <input type="number" id="epaule" placeholder="Tour d'épaule (cm)">
        </div>
      </div>
    </div>

    <!-- Section 3 -->
    <div class="anim d-3">
      <div class="titre-section">03. Sélection de Qualité</div>
      <div class="champ">
        <textarea id="qualite" placeholder="Précisez votre sélection..."></textarea>
      </div>
    </div>

    <!-- Bouton -->
    <div class="anim d-4">
      <button type="button" class="bouton" id="envoyer">Transmettre à l'atelier</button>
    </div>

  </main>
