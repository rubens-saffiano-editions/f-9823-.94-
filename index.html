<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Facture & Fiche Atelier — Rubens Saffiano</title>
<meta name="theme-color" content="#F7F5F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root { 
    --f: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; 
    --fond: #F7F5F0;
    --texte: #111;
    --ligne: #d4cec4;
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-weight: normal; }
  
  html, body {
    background-color: var(--fond);
    color: var(--texte);
    font-family: var(--f);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100vh;
    height: 100dvh; 
    overflow: hidden; 
    display: flex;
    flex-direction: column;
  }
  
  /* --- En-tête --- */
  header.entete {
    height: 52px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--fond);
    z-index: 1000;
    padding: 0 20px;
    position: relative;
  }
  
  .vague-gauche, .vague-droite {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ligne));
    opacity: 0;
    animation: fadeIn 1.5s ease 0.5s forwards;
  }
  .vague-gauche { margin-right: 15px; }
  .vague-droite { background: linear-gradient(90deg, var(--ligne), transparent); margin-left: 15px; }

  header.entete .marque {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--texte);
    opacity: 0;
    animation: fadeIn 1.5s ease 0.3s forwards;
    white-space: nowrap;
  }

  header.entete::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background-color: #e3ded5;
    animation: expandLine 1.5s cubic-bezier(0.8, 0, 0.2, 1) forwards;
  }

  /* --- Animations --- */
  @keyframes expandLine { to { width: 100%; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .anim {
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .d-1 { animation-delay: 0.1s; }
  .d-2 { animation-delay: 0.2s; }
  .d-3 { animation-delay: 0.3s; }
  .d-4 { animation-delay: 0.4s; }

  /* --- Conteneur Flexbox --- */
  main.conteneur {
    flex: 1; 
    display: flex;
    flex-direction: column;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
    padding: 16px 24px 24px;
    overflow-y: auto; 
  }
  
  /* --- Titres de section --- */
  .titre-section {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 20px 0 10px 0;
    border-bottom: 1px solid #e3ded5;
    padding-bottom: 6px;
    color: var(--texte);
  }
  .titre-section:first-child { margin-top: 8px; }
  
  /* --- Champs et Zone de texte (Unifiés) --- */
  .champ, .champ-zone { 
    margin-bottom: 16px; 
    position: relative; 
  }
  
  .champ input, 
  .champ textarea,
  .champ-zone textarea {
    width: 100%;
    font-family: var(--f) !important; /* Force la police */
    font-size: 15px !important;      /* Force la taille */
    font-weight: 300 !important;     /* Force la graisse fine */
    color: var(--texte) !important;
    border: 0;
    border-bottom: 1px solid var(--ligne);
    background: transparent;
    padding: 12px 0 8px 0;
    outline: none;
    border-radius: 0;
    appearance: none;
    transition: border-color 0.3s ease;
  }
  
  .champ input:focus, 
  .champ textarea:focus,
  .champ-zone textarea:focus {
    border-bottom: 1px solid var(--texte);
  }
  
  .champ input::placeholder, 
  .champ textarea::placeholder,
  .champ-zone textarea::placeholder { 
    color: #888; 
    font-family: var(--f) !important;
    font-size: 15px !important;
    font-weight: 300 !important;
  }

  /* --- ZONE DE TEXTE : Intégration parfaite --- */
  .section-qualite {
    flex: 1; 
    display: flex;
    flex-direction: column;
    min-height: 100px;
  }
  
  .champ-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 0;
  }

  .champ-zone textarea { 
    flex: 1; 
    /* Suppression des styles natifs du navigateur mobile */
    border: none !important;
    border-bottom: 1px solid var(--ligne) !important; 
    background: transparent !important; 
    box-shadow: none !important;
    -webkit-appearance: none !important;
    appearance: none !important;
    resize: none !important; 
    border-radius: 0 !important;
  }

  .champ-zone textarea:focus {
    border-bottom: 1px solid var(--texte) !important;
    background: transparent !important;
  }

  /* --- Grille --- */
  .grille { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    column-gap: 20px; 
  }
  
  /* --- Bouton --- */
  .bouton-wrapper {
    margin-top: auto; 
    padding-top: 20px;
  }

  .bouton {
    display: block;
    width: 100%;
    background: var(--texte);
    color: var(--fond);
    border: 1px solid var(--texte);
    padding: 16px;
    font-family: var(--f);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .25em;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .bouton:hover { background: transparent; color: var(--texte); }

  /* --- PDF Style --- */
  .pdf-rendu {
    background-color: #F7F5F0;
    padding: 40px;
    font-family: var(--f);
    color: #111;
  }
  .pdf-entete {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 30px;
    border-bottom: 1px solid #e3ded5;
    padding-bottom: 15px;
  }
</style>
</head>
<body>

  <header class="entete">
    <div class="vague-gauche"></div>
    <span class="marque">RUBENS SAFFIANO</span>
    <div class="vague-droite"></div>
  </header>

  <main class="conteneur" id="zone-formulaire">
    
    <!-- Section 1 -->
    <div class="anim d-1">
      <div class="titre-section">01. Informations Personnelles</div>
      <div class="champ">
        <input type="text" id="nom" placeholder="Nom et Prénom" autocomplete="name">
      </div>
      <div class="champ">
        <input type="tel" id="tel" placeholder="Numéro de téléphone" autocomplete="tel">
      </div>
      <div class="champ">
        <input type="text" id="adresse" placeholder="Adresse complète de livraison" autocomplete="street-address">
      </div>
    </div>

    <!-- Section 2 -->
    <div class="anim d-2">
      <div class="titre-section">02. Caractéristiques Morphologiques</div>
      <div class="grille">
        <div class="champ">
          <input type="number" id="taille" placeholder="Taille (cm)">
        </div>
        <div class="champ">
          <input type="number" id="poids" placeholder="Poids (kg)">
        </div>
        <div class="champ">
          <input type="number" id="poitrine" placeholder="Tour de poitrine (cm)">
        </div>
        <div class="champ">
          <input type="number" id="epaule" placeholder="Tour d'épaule (cm)">
        </div>
      </div>
    </div>

    <!-- Section 3 -->
    <div class="anim d-3 section-qualite">
      <div class="titre-section">03. Sélection de Qualité</div>
      <div class="champ-zone">
        <textarea id="qualite" placeholder="Précisez votre sélection, vos envies, vos finitions..."></textarea>
      </div>
    </div>

    <!-- Bouton -->
    <div class="anim d-4 bouton-wrapper">
      <button type="button" class="bouton" id="envoyer">Transmettre à l'atelier</button>
    </div>

  </main>

  <script>
    document.getElementById("envoyer").addEventListener("click", function(){
      var btn = this;
      btn.innerText = "Génération du PDF...";

      var nom = document.getElementById("nom").value.trim() || "Client";
      var tel = document.getElementById("tel").value.trim() || "—";
      var adresse = document.getElementById("adresse").value.trim() || "—";
      var taille = document.getElementById("taille").value.trim() || "—";
      var poids = document.getElementById("poids").value.trim() || "—";
      var poitrine = document.getElementById("poitrine").value.trim() || "—";
      var epaule = document.getElementById("epaule").value.trim() || "—";
      var qualite = document.getElementById("qualite").value.trim() || "—";

      var element = document.createElement('div');
      element.className = 'pdf-rendu';
      element.innerHTML = `
        <div class="pdf-entete">RUBENS SAFFIANO — FICHE ATELIER</div>
        
        <div class="titre-section" style="margin-top: 0;">01. INFORMATIONS PERSONNELLES</div>
        <p style="margin-bottom:8px; font-size: 14px;"><strong>Nom et Prénom :</strong> ${nom}</p>
        <p style="margin-bottom:8px; font-size: 14px;"><strong>Téléphone :</strong> ${tel}</p>
        <p style="margin-bottom:24px; font-size: 14px;"><strong>Adresse :</strong> ${adresse}</p>
        
        <div class="titre-section">02. CARACTÉRISTIQUES MORPHOLOGIQUES</div>
        <p style="margin-bottom:8px; font-size: 14px;"><strong>Taille :</strong> ${taille !== "—" ? taille + " cm" : "—"}</p>
        <p style="margin-bottom:8px; font-size: 14px;"><strong>Poids :</strong> ${poids !== "—" ? poids + " kg" : "—"}</p>
        <p style="margin-bottom:8px; font-size: 14px;"><strong>Tour de poitrine :</strong> ${poitrine !== "—" ? poitrine + " cm" : "—"}</p>
        <p style="margin-bottom:24px; font-size: 14px;"><strong>Tour d'épaule :</strong> ${epaule !== "—" ? epaule + " cm" : "—"}</p>
        
        <div class="titre-section">03. SÉLECTION DE QUALITÉ</div>
        <p style="white-space: pre-wrap; font-size: 14px; line-height: 1.5;">${qualite}</p>
      `;

      var opt = {
        margin:       15,
        filename:     'Fiche_Mesures_Rubens_Saffiano.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(function(){
        btn.innerText = "Transmettre à l'atelier";
        var msg = "Bonjour Rubens Saffiano,\nJe viens de télécharger ma fiche de mesures en PDF. Je vous la joins à ce message 📎.";
        var numWA = "33695772805";
        window.open("https://wa.me/" + numWA + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
      });
    });
  </script>

</body>
</html>
