<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Fiche Atelier — Rubens Saffiano</title>
<meta name="theme-color" content="#F7F5F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { 
    --f: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; 
    --fond: #F7F5F0;
    --texte: #111;
    --ligne: #d4cec4;
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-weight: normal; }
  
  html, body {
    background-color: var(--fond);
    color: var(--texte);
    font-family: var(--f);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100vh;
    height: 100dvh; 
    overflow: hidden; 
    display: flex;
    flex-direction: column;
  }
  
  /* --- En-tête --- */
  header.entete {
    height: 52px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--fond);
    z-index: 1000;
    padding: 0 20px;
    position: relative;
  }
  
  .vague-gauche, .vague-droite {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ligne));
    opacity: 0;
    animation: fadeIn 1.5s ease 0.5s forwards;
  }
  .vague-gauche { margin-right: 15px; }
  .vague-droite { background: linear-gradient(90deg, var(--ligne), transparent); margin-left: 15px; }

  header.entete .marque {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--texte);
    opacity: 0;
    animation: fadeIn 1.5s ease 0.3s forwards;
    white-space: nowrap;
  }

  header.entete::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background-color: #e3ded5;
    animation: expandLine 1.5s cubic-bezier(0.8, 0, 0.2, 1) forwards;
  }

  /* --- Animations --- */
  @keyframes expandLine { to { width: 100%; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .anim {
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .d-1 { animation-delay: 0.1s; }
  .d-2 { animation-delay: 0.2s; }
  .d-3 { animation-delay: 0.3s; }
  .d-4 { animation-delay: 0.4s; }

  /* --- Conteneur Flexbox --- */
  main.conteneur {
    flex: 1; 
    display: flex;
    flex-direction: column;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
    padding: 16px 24px 24px;
    overflow-y: auto; 
  }
  
  /* --- Titres de section --- */
  .titre-section {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 20px 0 10px 0;
    border-bottom: 1px solid #e3ded5;
    padding-bottom: 6px;
    color: var(--texte);
  }
  .titre-section:first-child { margin-top: 8px; }
  
  /* --- Champs et Zone de texte --- */
  .champ, .champ-zone { 
    margin-bottom: 16px; 
    position: relative; 
  }
  
  .champ input, 
  .champ textarea,
  .champ-zone textarea {
    width: 100%;
    font-family: var(--f) !important;
    font-size: 15px !important;
    font-weight: 300 !important;
    color: var(--texte) !important;
    border: 0;
    border-bottom: 1px solid var(--ligne);
    background: transparent;
    padding: 12px 0 8px 0;
    outline: none;
    border-radius: 0;
    appearance: none;
    transition: border-color 0.3s ease;
  }
  
  .champ input:focus, 
  .champ textarea:focus,
  .champ-zone textarea:focus {
    border-bottom: 1px solid var(--texte);
  }
  
  .champ input::placeholder, 
  .champ textarea::placeholder,
  .champ-zone textarea::placeholder { 
    color: #888; 
    font-family: var(--f) !important;
    font-size: 15px !important;
    font-weight: 300 !important;
  }

  /* --- ZONE DE TEXTE --- */
  .section-qualite {
    flex: 1; 
    display: flex;
    flex-direction: column;
    min-height: 100px;
  }
  
  .champ-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 0;
  }

  .champ-zone textarea { 
    flex: 1; 
    border: none !important;
    border-bottom: 1px solid var(--ligne) !important; 
    background: transparent !important; 
    box-shadow: none !important;
    -webkit-appearance: none !important;
    appearance: none !important;
    resize: none !important; 
    border-radius: 0 !important;
  }

  .champ-zone textarea:focus {
    border-bottom: 1px solid var(--texte) !important;
    background: transparent !important;
  }

  /* --- Grille --- */
  .grille { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    column-gap: 20px; 
  }
  
  /* --- Bouton --- */
  .bouton-wrapper {
    margin-top: auto; 
    padding-top: 20px;
  }

  .bouton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: var(--texte);
    color: var(--fond);
    border: 1px solid var(--texte);
    padding: 16px;
    font-family: var(--f);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .bouton:hover { background: transparent; color: var(--texte); }
  .bouton svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

  <header class="entete">
    <div class="vague-gauche"></div>
    <span class="marque">RUBENS SAFFIANO</span>
    <div class="vague-droite"></div>
  </header>

  <main class="conteneur" id="zone-formulaire">
    
    <!-- Section 1 -->
    <div class="anim d-1">
      <div class="titre-section">01. Informations Personnelles</div>
      <div class="champ">
        <input type="text" id="nom" placeholder="Nom et Prénom" autocomplete="name">
      </div>
      <div class="champ">
        <input type="tel" id="tel" placeholder="Numéro de téléphone" autocomplete="tel">
      </div>
      <div class="champ">
        <input type="text" id="adresse" placeholder="Adresse complète de livraison" autocomplete="street-address">
      </div>
    </div>

    <!-- Section 2 -->
    <div class="anim d-2">
      <div class="titre-section">02. Caractéristiques Morphologiques</div>
      <div class="grille">
        <div class="champ">
          <input type="number" id="taille" placeholder="Taille (cm)">
        </div>
        <div class="champ">
          <input type="number" id="poids" placeholder="Poids (kg)">
        </div>
        <div class="champ">
          <input type="number" id="poitrine" placeholder="Tour de poitrine (cm)">
        </div>
        <div class="champ">
          <input type="number" id="epaule" placeholder="Tour d'épaule (cm)">
        </div>
      </div>
    </div>

    <!-- Section 3 -->
    <div class="anim d-3 section-qualite">
      <div class="titre-section">03. Sélection de Qualité</div>
      <div class="champ-zone">
        <textarea id="qualite" placeholder="Précisez votre sélection, vos envies, vos finitions..."></textarea>
      </div>
    </div>

    <!-- Bouton WhatsApp -->
    <div class="anim d-4 bouton-wrapper">
      <button type="button" class="bouton" id="envoyer">
        <svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.2L3.3 20.7l4.4-1.1A8.8 8.8 0 1 0 12 3.2Z"/><path d="M8.9 8.3c.2-.5.6-.6 1-.6l.6 1.6-.7.9c.6 1.4 1.7 2.5 3.1 3.1l.9-.7 1.6.6c0 .4-.1.8-.6 1-2.9.8-6.6-2.9-5.9-5.9Z"/></svg>
        Transmettre à l'atelier
      </button>
    </div>

  </main>

  <script>
    document.getElementById("envoyer").addEventListener("click", function(){
      // Récupération des valeurs (ou "—" si vide)
      var nom = document.getElementById("nom").value.trim() || "Non renseigné";
      var tel = document.getElementById("tel").value.trim() || "Non renseigné";
      var adresse = document.getElementById("adresse").value.trim() || "Non renseignée";
      
      var taille = document.getElementById("taille").value.trim() ? document.getElementById("taille").value.trim() + " cm" : "—";
      var poids = document.getElementById("poids").value.trim() ? document.getElementById("poids").value.trim() + " kg" : "—";
      var poitrine = document.getElementById("poitrine").value.trim() ? document.getElementById("poitrine").value.trim() + " cm" : "—";
      var epaule = document.getElementById("epaule").value.trim() ? document.getElementById("epaule").value.trim() + " cm" : "—";
      
      var qualite = document.getElementById("qualite").value.trim() || "Aucune précision.";

      // Création du message avec une signature luxueuse
      var message = 
        "*FICHE ATELIER — RUBENS SAFFIANO*\n\n" +
        "*01. INFORMATIONS PERSONNELLES*\n" +
        "• *Nom :* " + nom + "\n" +
        "• *Téléphone :* " + tel + "\n" +
        "• *Adresse :* " + adresse + "\n\n" +
        "*02. MESURES*\n" +
        "• Taille : " + taille + "\n" +
        "• Poids : " + poids + "\n" +
        "• Poitrine : " + poitrine + "\n" +
        "• Épaules : " + epaule + "\n\n" +
        "*03. SÉLECTION & FINITIONS*\n" +
        qualite + "\n\n" +
        "----------------------------------\n\n" +
        "*Merci de votre confiance.*\n" +
        "Votre demande a bien été transmise à notre atelier. Chaque création étant façonnée avec le plus grand soin, un conseiller de la Maison vous recontactera très prochainement pour finaliser les détails.\n\n" +
        "_La Maison Rubens Saffiano_";

      // Numéro WhatsApp de l'atelier
      var numWA = "33695772805"; 
      
      // Ouverture de WhatsApp avec le message pré-rempli
      var url = "https://wa.me/" + numWA + "?text=" + encodeURIComponent(message);
      window.open(url, "_blank", "noopener");
    });
  </script>

</body>
</html>
