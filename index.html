<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- SECURITÉ ANTI-RÉFÉRENCEMENT ABSOLUE -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Rubens Saffiano</title>
<meta name="theme-color" content="#F9F8F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Script de génération PDF local -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root { --f: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-weight: normal; }
  
  html, body {
    background-color: #F9F8F6;
    color: #000;
    font-family: var(--f);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  /* --- En-tête officiel --- */
  header.entete {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background-color: #F9F8F6;
    border-bottom: 1px solid #eae6e0;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .bloc-g, .bloc-d { display: flex; gap: 20px; align-items: center; }
  header.entete .marque {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #000;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .icone-btn { width: 18px; height: 52px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #000; }
  svg.ic { width: 18px; height: 18px; stroke-width: 1.5px; stroke: #000; fill: none; }

  /* --- Formulaire & zones à imprimer --- */
  .conteneur { max-width: 600px; margin: 0 auto; padding: 40px 24px 80px; }
  
  .titre-section {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    margin: 40px 0 20px 0;
    border-bottom: 1px solid #eae6e0;
    padding-bottom: 10px;
  }
  .titre-section:first-child { margin-top: 0; }
  
  .champ { margin-bottom: 16px; position: relative; }
  .champ input, .champ textarea {
    width: 100%;
    font-family: var(--f);
    font-size: 13px;
    font-weight: 300;
    color: #000;
    border: 0;
    border-bottom: 1px solid #000;
    background: transparent;
    padding: 12px 0;
    outline: none;
    border-radius: 0;
    appearance: none;
  }
  .champ input::placeholder, .champ textarea::placeholder { color: #888; }
  .champ textarea { resize: vertical; min-height: 80px; }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  
  /* --- Bouton d'action --- */
  .bouton {
    display: block;
    width: 100%;
    margin-top: 40px;
    background: #fff;
    color: #000;
    border: 1px solid #000;
    padding: 16px;
    font-family: var(--f);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .25em;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
  }
  .bouton:hover { background: #000; color: #fff; }

  /* Style du document PDF généré */
  .pdf-rendu {
    background-color: #F9F8F6;
    padding: 40px;
    font-family: var(--f);
    color: #000;
  }
  .pdf-entete {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 30px;
    border-bottom: 1px solid #eae6e0;
    padding-bottom: 15px;
  }
</style>
</head>
<body>

  <!-- En-tête du site -->
  <header class="entete">
    <div class="bloc-g">
      <button class="icone-btn" type="button"><svg class="ic" viewBox="0 0 24 24"><line x1="2" y1="6" x2="22" y2="6"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="18" x2="22" y2="18"/></svg></button>
      <button class="icone-btn" type="button"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="20.5" y2="20.5"/></svg></button>
    </div>
    <span class="marque">RUBENS SAFFIANO</span>
    <div class="bloc-d">
      <button class="icone-btn" type="button"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></button>
      <button class="icone-btn" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.2L3.3 20.7l4.4-1.1A8.8 8.8 0 1 0 12 3.2Z"/><path d="M8.9 8.3c.2-.5.6-.6 1-.6l.6 1.6-.7.9c.6 1.4 1.7 2.5 3.1 3.1l.9-.7 1.6.6c0 .4-.1.8-.6 1-2.9.8-6.6-2.9-5.9-5.9Z"/></svg></button>
    </div>
  </header>

  <main class="conteneur" id="zone-formulaire">
    
    <!-- Section 1 -->
    <div class="titre-section">01. Informations Personnelles</div>
    <div class="champ">
      <input type="text" id="nom" placeholder="Nom et Prénom" autocomplete="name">
    </div>
    <div class="champ">
      <input type="tel" id="tel" placeholder="Numéro de téléphone" autocomplete="tel">
    </div>
    <div class="champ">
      <input type="text" id="adresse" placeholder="Adresse complète de livraison" autocomplete="street-address">
    </div>

    <!-- Section 2 -->
    <div class="titre-section">02. Caractéristiques Morphologiques</div>
    <div class="grille">
      <div class="champ">
        <input type="number" id="taille" placeholder="Taille (cm)">
      </div>
      <div class="champ">
        <input type="number" id="poids" placeholder="Poids (kg)">
      </div>
      <div class="champ">
        <input type="number" id="poitrine" placeholder="Tour de poitrine (cm)">
      </div>
      <div class="champ">
        <input type="number" id="epaule" placeholder="Tour d'épaule (cm)">
      </div>
    </div>

    <!-- Section 3 -->
    <div class="titre-section">03. Sélection de Qualité</div>
    <div class="champ">
      <textarea id="qualite" placeholder="Précisez votre sélection..."></textarea>
    </div>

    <button type="button" class="bouton" id="envoyer">Transmettre à l'atelier</button>

  </main>

  <script>
    document.getElementById("envoyer").addEventListener("click", function(){
      var btn = this;
      btn.innerText = "Génération du PDF...";

      // Préparation du dossier temporaire pour le PDF
      var nom = document.getElementById("nom").value.trim() || "Client";
      var tel = document.getElementById("tel").value.trim() || "—";
      var adresse = document.getElementById("adresse").value.trim() || "—";
      var taille = document.getElementById("taille").value.trim() || "—";
      var poids = document.getElementById("poids").value.trim() || "—";
      var poitrine = document.getElementById("poitrine").value.trim() || "—";
      var epaule = document.getElementById("epaule").value.trim() || "—";
      var qualite = document.getElementById("qualite").value.trim() || "—";

      var element = document.createElement('div');
      element.className = 'pdf-rendu';
      element.innerHTML = `
        <div class="pdf-entete">RUBENS SAFFIANO — FICHE ATELIER</div>
        <div class="titre-section">01. INFORMATIONS PERSONNELLES</div>
        <p style="margin-bottom:8px;"><strong>Nom et Prénom :</strong> ${nom}</p>
        <p style="margin-bottom:8px;"><strong>Téléphone :</strong> ${tel}</p>
        <p style="margin-bottom:20px;"><strong>Adresse :</strong> ${adresse}</p>
        
        <div class="titre-section">02. CARACTÉRISTIQUES MORPHOLOGIQUES</div>
        <p style="margin-bottom:8px;"><strong>Taille :</strong> ${taille !== "—" ? taille + " cm" : "—"}</p>
        <p style="margin-bottom:8px;"><strong>Poids :</strong> ${poids !== "—" ? poids + " kg" : "—"}</p>
        <p style="margin-bottom:8px;"><strong>Tour de poitrine :</strong> ${poitrine !== "—" ? poitrine + " cm" : "—"}</p>
        <p style="margin-bottom:20px;"><strong>Tour d'épaule :</strong> ${epaule !== "—" ? epaule + " cm" : "—"}</p>
        
        <div class="titre-section">03. SÉLECTION DE QUALITÉ</div>
        <p style="white-space: pre-wrap;">${qualite}</p>
      `;

      var opt = {
        margin:       10,
        filename:     'Fiche_Mesures_Rubens_Saffiano.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      // Génération et téléchargement local du PDF
      html2pdf().set(opt).from(element).save().then(function(){
        btn.innerText = "Transmettre à l'atelier";
        
        // Redirection WhatsApp
        var msg = "Bonjour Rubens Saffiano,\nJe viens de télécharger ma fiche de mesures en PDF. Je vous la joins à ce message 📎.";
        var numWA = "33695772805";
        window.open("https://wa.me/" + numWA + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
      });
    });
  </script>

</body>
</html>
